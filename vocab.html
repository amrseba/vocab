<style>
  :root{
    --paper:#f6f1e4;
    --paper-line:#e3d9c0;
    --ink:#2a2f45;
    --ink-soft:#5b5f78;
    --red:#b4432f;
    --red-soft:#d97757;
    --gold:#a9822f;
    --card-back:#2a2f45;
    --card-back-text:#f6f1e4;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    background-image:
      linear-gradient(var(--paper-line) 1px, transparent 1px);
    background-size: 100% 34px;
    color:var(--ink);
    font-family: Georgia, 'Times New Roman', serif;
    min-height:100vh;
    padding-bottom:40px;
  }
  header{
    padding:22px 18px 14px;
    position:sticky;
    top:0;
    background:var(--paper);
    z-index:5;
    border-bottom:2px solid var(--ink);
  }
  h1{
    margin:0 0 2px;
    font-size:1.5rem;
    letter-spacing:0.5px;
    color:var(--ink);
    display:flex;
    align-items:baseline;
    gap:8px;
  }
  h1 .accent{color:var(--red);font-style:italic;}
  .sub{
    margin:0 0 14px;
    color:var(--ink-soft);
    font-size:0.85rem;
    font-family: -apple-system, system-ui, sans-serif;
  }
  #search{
    width:100%;
    padding:11px 14px;
    border-radius:8px;
    border:1.5px solid var(--ink);
    background:#fffdf8;
    font-family: -apple-system, system-ui, sans-serif;
    font-size:1rem;
    color:var(--ink);
  }
  #search::placeholder{color:#9b93a0;}
  nav#tabs{
    display:flex;
    gap:8px;
    overflow-x:auto;
    padding:12px 18px 0;
    -webkit-overflow-scrolling:touch;
    scrollbar-width:none;
  }
  nav#tabs::-webkit-scrollbar{display:none;}
  .tab{
    flex:0 0 auto;
    font-family:-apple-system, system-ui, sans-serif;
    font-size:0.82rem;
    font-weight:600;
    padding:7px 13px;
    border-radius:20px;
    border:1.5px solid var(--ink);
    background:transparent;
    color:var(--ink);
    cursor:pointer;
    white-space:nowrap;
  }
  .tab.active{
    background:var(--ink);
    color:var(--paper);
  }
  main{padding:18px;}
  .lesson-title{
    font-size:0.78rem;
    font-family:-apple-system, system-ui, sans-serif;
    text-transform:uppercase;
    letter-spacing:1.5px;
    color:var(--gold);
    margin:18px 2px 10px;
    display:flex;
    align-items:center;
    gap:8px;
  }
  .lesson-title::before{
    content:"";
    width:22px;height:1px;background:var(--gold);
    display:inline-block;
  }
  .grid{
    display:grid;
    grid-template-columns:1fr;
    gap:12px;
  }
  @media(min-width:640px){
    .grid{grid-template-columns:1fr 1fr;}
  }
  .card{
    perspective:1200px;
    height:118px;
  }
  .card-inner{
    position:relative;
    width:100%;height:100%;
    transform-style:preserve-3d;
    transition:transform 0.45s cubic-bezier(.4,.2,.2,1);
  }
  .card.flipped .card-inner{transform:rotateY(180deg);}
  .face{
    position:absolute;inset:0;
    border-radius:10px;
    backface-visibility:hidden;
    padding:14px 16px;
    display:flex;
    flex-direction:column;
    justify-content:center;
    cursor:pointer;
  }
  .front{
    background:#fffdf8;
    border:1.5px solid var(--ink);
    box-shadow:3px 3px 0 var(--paper-line);
  }
  .front .term{
    font-size:1.12rem;
    font-weight:700;
    color:var(--ink);
    margin:0 0 4px;
  }
  .front .fr-def{
    font-size:0.86rem;
    color:var(--ink-soft);
    font-style:italic;
    line-height:1.3;
  }
  .front .tap-hint{
    position:absolute;
    bottom:8px;right:12px;
    font-family:-apple-system, system-ui, sans-serif;
    font-size:0.65rem;
    color:#b7ae9a;
  }
  .back{
    background:var(--card-back);
    color:var(--card-back-text);
    transform:rotateY(180deg);
    border-radius:10px;
    align-items:flex-end;
    text-align:right;
    direction:rtl;
  }
  .back .ar{
    font-size:1.15rem;
    line-height:1.5;
    font-family:'Geeza Pro','Noto Naskh Arabic', Tahoma, sans-serif;
  }
  .back .term-echo{
    direction:ltr;
    text-align:left;
    font-size:0.7rem;
    color:var(--red-soft);
    font-family:-apple-system, system-ui, sans-serif;
    margin-top:6px;
  }
  #empty{
    display:none;
    text-align:center;
    color:var(--ink-soft);
    font-family:-apple-system, system-ui, sans-serif;
    padding:40px 10px;
  }
  footer{
    text-align:center;
    color:#a49c88;
    font-family:-apple-system, system-ui, sans-serif;
    font-size:0.72rem;
    padding:26px 10px 6px;
  }
</style>
</head>

<header>
  <h1>Carnet de vocabulaire <span class="accent">— français</span></h1>
  <p class="sub">Appuie sur une carte pour voir le sens en arabe. Cherche un mot ci-dessous.</p>
  <input id="search" type="text" placeholder="Chercher un mot... (ex: convaincre)">
</header>

<nav id="tabs"></nav>

<main>
  <div id="lessons"></div>
  <div id="empty">Aucun mot trouvé.</div>
</main>

<footer>7 leçons · appuie pour retourner la carte</footer>

function makeTab(n, active){
  const b = document.createElement('button');
  b.className = 'tab' + (active ? ' active' : '');
  b.textContent = n === 'all' ? 'Tout' : 'Leçon ' + n;
  b.dataset.val = n;
  b.onclick = () => {
    document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
    b.classList.add('active');
    render();
  };
  return b;
}

tabsEl.appendChild(makeTab('all', true));
lessonNums.forEach(n => tabsEl.appendChild(makeTab(n, false)));

function currentTab(){
  const active = document.querySelector('.tab.active');
  return active ? active.dataset.val : 'all';
}

function render(){
  const q = searchEl.value.trim().toLowerCase();
  const tab = currentTab();
  lessonsEl.innerHTML = '';

  let anyMatch = false;
  lessonNums.forEach(n => {
    if (tab !== 'all' && String(tab) !== String(n)) return;
    const items = DATA.filter(d => d.c === n && (
      !q || d.t.toLowerCase().includes(q) || d.fr.toLowerCase().includes(q) || d.ar.includes(q)
    ));
    if (items.length === 0) return;
    anyMatch = true;

    const title = document.createElement('div');
    title.className = 'lesson-title';
    title.textContent = 'Leçon ' + n;
    lessonsEl.appendChild(title);

    const grid = document.createElement('div');
    grid.className = 'grid';
    items.forEach(d => grid.appendChild(makeCard(d)));
    lessonsEl.appendChild(grid);
  });

  emptyEl.style.display = anyMatch ? 'none' : 'block';
}

function makeCard(d){
  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML = `
    <div class="card-inner">
      <div class="face front">
        <p class="term">${d.t}</p>
        <p class="fr-def">${d.fr}</p>
        <span class="tap-hint">toucher ↻</span>
      </div>
      <div class="face back">
        <div>
          <p class="ar">${d.ar}</p>
          <p class="term-echo">${d.t}</p>
        </div>
      </div>
    </div>
  `;
  card.onclick = () => card.classList.toggle('flipped');
  return card;
}

searchEl.addEventListener('input', render);
render();
</script>
</body>
</html>
